name: Toggle cpublished Worker

on:
  schedule:
    # 1:00 AM Hora de México (America/Mexico_City, UTC-6) -> 07:00 UTC
    - cron: '0 7 * * *'
    # 6:00 AM Hora de México (America/Mexico_City, UTC-6) -> 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      estado:
        description: 'Valor que deseas aplicar a cpublished'
        required: true
        default: 'Si'
        type: choice
        options:
          - 'Si'
          - 'Vacio'

permissions:
  contents: write

jobs:
  update-cpublished:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar unicamente cpublished byte a byte
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'informacion.json';
            const branch = 'master';

            // Determinar el valor objetivo ("Si" a la 1:00 AM MX, "" a las 6:00 AM MX)
            let targetValue;
            if (context.eventName === 'workflow_dispatch') {
              targetValue = context.payload.inputs.estado === 'Si' ? 'Si' : '';
            } else if (context.payload.schedule === '0 7 * * *') {
              targetValue = 'Si';
            } else if (context.payload.schedule === '0 12 * * *') {
              targetValue = '';
            } else {
              const mxHour = Number(
                new Intl.DateTimeFormat('en-US', {
                  timeZone: 'America/Mexico_City',
                  hour: 'numeric',
                  hour12: false
                }).format(new Date())
              );
              targetValue = (mxHour >= 1 && mxHour < 6) ? 'Si' : '';
            }

            const { data: fileData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch
            });

            const originalBuffer = Buffer.from(fileData.content, 'base64');
            const originalText = originalBuffer.toString('utf8');

            const emptyPattern = '\t"cpublished":"",';
            const activePattern = '\t"cpublished":"Si",';
            const desiredPattern = `\t"cpublished":"${targetValue}",`;
            const currentPattern = targetValue === 'Si' ? emptyPattern : activePattern;

            if (originalText.includes(desiredPattern)) {
              core.info(`El campo cpublished ya se encuentra en "${targetValue}". No se requiere ningún cambio.`);
              return;
            }

            const occurrences = originalText.split(currentPattern).length - 1;
            if (occurrences !== 1) {
              core.setFailed(`Error de integridad: se esperaba exactamente 1 ocurrencia de ${JSON.stringify(currentPattern)}, pero se encontraron ${occurrences}.`);
              return;
            }

            const updatedText = originalText.replace(currentPattern, desiredPattern);
            const updatedBuffer = Buffer.from(updatedText, 'utf8');

            // Verificación estricta de que ningún otro byte o salto de línea cambió
            const expectedDelta = targetValue === 'Si' ? 2 : -2;
            const actualDelta = updatedBuffer.length - originalBuffer.length;
            if (actualDelta !== expectedDelta) {
              core.setFailed(`Error de integridad de bytes: diferencia esperada ${expectedDelta}, diferencia real ${actualDelta}.`);
              return;
            }

            const roundTripBuffer = Buffer.from(updatedText.replace(desiredPattern, currentPattern), 'utf8');
            if (Buffer.compare(originalBuffer, roundTripBuffer) !== 0) {
              core.setFailed('Error de integridad: la verificación byte a byte falló.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `chore: set cpublished to "${targetValue}"`,
              content: updatedBuffer.toString('base64'),
              sha: fileData.sha
            });

            core.info(`Actualizado correctamente: "cpublished":"${targetValue}" (${originalBuffer.length} -> ${updatedBuffer.length} bytes).`);
